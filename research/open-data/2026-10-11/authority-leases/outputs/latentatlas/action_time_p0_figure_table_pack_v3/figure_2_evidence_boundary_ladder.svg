<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-label="Evidence Boundary Ladder">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#52616f" />
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="360" fill="#fbfaf7" />
  <text x="44" y="42" font-size="24" font-family="Arial, Helvetica, sans-serif" font-weight="700" fill="#17202a">Evidence Boundary Ladder</text>
  <text x="44" y="72" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#5d6670">Observation, evidence, decision, action authority, and execution are separate boundary states.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <line x1="224" y1="189.0" x2="256" y2="189.0" stroke="#52616f" stroke-width="2" marker-end="url(#arrow)" /><line x1="436" y1="189.0" x2="468" y2="189.0" stroke="#52616f" stroke-width="2" marker-end="url(#arrow)" /><line x1="648" y1="189.0" x2="680" y2="189.0" stroke="#52616f" stroke-width="2" marker-end="url(#arrow)" /><line x1="860" y1="189.0" x2="892" y2="189.0" stroke="#52616f" stroke-width="2" marker-end="url(#arrow)" />
    <rect x="44" y="150" width="180" height="78" rx="7" fill="#eef4f9" stroke="#9aa8b5" /><text x="134.0" y="180" text-anchor="middle" font-size="14" fill="#17202a">Observation</text><rect x="256" y="150" width="180" height="78" rx="7" fill="#f7f3df" stroke="#9aa8b5" /><text x="346.0" y="180" text-anchor="middle" font-size="14" fill="#17202a">Evidence packet</text><rect x="468" y="150" width="180" height="78" rx="7" fill="#eef4f9" stroke="#9aa8b5" /><text x="558.0" y="180" text-anchor="middle" font-size="14" fill="#17202a">Decision evidence</text><rect x="680" y="150" width="180" height="78" rx="7" fill="#f7f3df" stroke="#9aa8b5" /><text x="770.0" y="180" text-anchor="middle" font-size="14" fill="#17202a">Action authority</text><rect x="892" y="150" width="180" height="78" rx="7" fill="#eef4f9" stroke="#9aa8b5" /><text x="982.0" y="180" text-anchor="middle" font-size="14" fill="#17202a">Execution</text>
  </g>
</svg>
