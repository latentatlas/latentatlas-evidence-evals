name: Bug report
description: Report a reproducible problem in the package, CLI, examples, or tests.
title: "[Bug]: "
labels: []
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve LatentAtlas Evidence Evals.
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe the observed behavior and why it is unexpected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide commands and synthetic input sufficient to reproduce the issue.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe the verdict, reason code, output, or invariant you expected.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.11.9"
    validations:
      required: true
  - type: checkboxes
    id: data
    attributes:
      label: Data check
      options:
        - label: The report contains only synthetic or deliberately public data.
          required: true
